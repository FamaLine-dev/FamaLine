<!-- templates/accounts/forgot_password.html -->
{% extends 'base.html' %}
{% block title %}Lupa Password - FamaLine{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-16 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-cream-200">
        <div class="bg-gradient-to-r from-teracotta to-warmbrown px-6 py-8 text-white text-center">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-key text-3xl text-teracotta"></i>
            </div>
            <h1 class="text-2xl font-bold">Lupa Password?</h1>
            <p class="text-white/80 text-sm mt-2">Kami akan mengirimkan link reset password ke email Anda</p>
        </div>
        
        <div class="p-6">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-envelope mr-2 text-teracotta"></i>Email Address
                    </label>
                    <input type="email" name="email" required 
                           class="w-full px-4 py-3 rounded-xl border border-cream-300 bg-cream-50/50 focus:border-teracotta focus:ring-2 focus:ring-teracotta/20 transition-all"
                           placeholder="Masukkan email Anda">
                </div>
                
                <button type="submit" class="w-full bg-teracotta text-white font-bold py-3.5 rounded-xl hover:shadow-lg transition-all duration-200">
                    <i class="fas fa-paper-plane mr-2"></i> Kirim Link Reset
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="{% url 'accounts:login' %}" class="text-teracotta text-sm hover:underline">
                    <i class="fas fa-arrow-left mr-1"></i> Kembali ke Halaman Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
