{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Profil - FamaLine{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-teracotta to-warmbrown px-6 py-4">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fas fa-user-edit"></i> Edit Profil
            </h1>
        </div>
        
        <form method="post" class="p-6 space-y-5">
            {% csrf_token %}
            
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Depan</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" 
                           class="w-full px-4 py-3 rounded-xl border border-cream-300 focus:border-teracotta focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Belakang</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" 
                           class="w-full px-4 py-3 rounded-xl border border-cream-300 focus:border-teracotta focus:outline-none">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Username <span class="text-red-500">*</span>
                </label>
                <input type="text" name="username" value="{{ user.username }}" required
                       class="w-full px-4 py-3 rounded-xl border border-cream-300 focus:border-teracotta focus:outline-none">
                <p class="text-xs text-gray-400 mt-1">Username unik untuk login Anda</p>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Email <span class="text-red-500">*</span>
                </label>
                <input type="email" name="email" value="{{ user.email }}" required
                       class="w-full px-4 py-3 rounded-xl border border-cream-300 focus:border-teracotta focus:outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="fab fa-whatsapp text-green-500 mr-1"></i> Nomor WhatsApp
                </label>
                <input type="tel" name="phone_number" value="{{ user.profile.phone_number }}" 
                       placeholder="08xxxxxxxxxx"
                       class="w-full px-4 py-3 rounded-xl border border-cream-300 focus:border-teracotta focus:outline-none">
                <p class="text-xs text-gray-400 mt-1">Digunakan untuk notifikasi dan pemulihan akun</p>
            </div>
            
            <div class="flex gap-3 pt-4">
                <a href="{% url 'accounts:profile' %}" 
                   class="flex-1 text-center px-4 py-3 rounded-xl border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                    Batal
                </a>
                <button type="submit" 
                        class="flex-1 bg-teracotta text-white font-semibold py-3 rounded-xl hover:bg-opacity-90 transition">
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
