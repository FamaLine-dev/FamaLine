{% extends 'base.html' %}
{% load static %}

{% block title %}Ganti Password - FamaLine{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-teracotta to-warmbrown px-6 py-4">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fas fa-key"></i> Ganti Password
            </h1>
        </div>
        
        <form method="post" class="p-6 space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password Saat Ini</label>
                <input type="password" name="current_password" required
                       class="w-full px-4 py-3 rounded-xl border border-cream-300 focus:border-teracotta focus:outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password Baru</label>
                <input type="password" name="new_password" required
                       class="w-full px-4 py-3 rounded-xl border border-cream-300 focus:border-teracotta focus:outline-none">
                <p class="text-xs text-gray-400 mt-1">Minimal 6 karakter</p>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Konfirmasi Password Baru</label>
                <input type="password" name="confirm_password" required
                       class="w-full px-4 py-3 rounded-xl border border-cream-300 focus:border-teracotta focus:outline-none">
            </div>
            
            <div class="flex gap-3 pt-4">
                <a href="{% url 'accounts:profile' %}" 
                   class="flex-1 text-center px-4 py-3 rounded-xl border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                    Batal
                </a>
                <button type="submit" 
                        class="flex-1 bg-teracotta text-white font-semibold py-3 rounded-xl hover:bg-opacity-90 transition">
                    Ganti Password
                </button>
            </div>
        </form>
        
        <div class="px-6 pb-6 text-center text-xs text-gray-400">
            <i class="fas fa-shield-alt"></i> Setelah mengganti password, Anda akan diminta login kembali
        </div>
    </div>
</div>
{% endblock %}
